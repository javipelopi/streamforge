version: 2
updates:
  # Rust (Cargo) dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # JavaScript (pnpm) dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      js-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3
