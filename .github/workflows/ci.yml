name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:vite

  test-rust:
    name: Test (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libdbus-1-dev libsqlite3-dev pkg-config libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        run: |
          cd src-tauri
          # Skip server::stream tests — they hang in CI (tokio runtime deadlock)
          cargo test -- --skip server::stream::tests &
          PID=$!
          # Wait up to 20 minutes for tests, then kill hanging process
          for i in $(seq 1 1200); do
            if ! kill -0 $PID 2>/dev/null; then
              wait $PID
              exit $?
            fi
            sleep 1
          done
          echo "Tests timed out after 20 minutes — killing"
          kill $PID 2>/dev/null
          wait $PID 2>/dev/null
          exit 1
