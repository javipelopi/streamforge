name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Desktop builds — each uploads artifacts, no release creation
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            rust-targets: ''
            tauri-args: --bundles nsis
            name: Windows-x64
          - platform: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''
            name: Linux-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libdbus-1-dev libsqlite3-dev pkg-config libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - run: pnpm install

      - name: Update version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i'' -e "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i'' -e "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
            sed -i'' -e "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
            sed -i "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.tauri-args }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp src-tauri/target/*/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
            cp src-tauri/target/*/release/bundle/macos/*.app.tar.gz artifacts/ 2>/dev/null || true
            cp src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig artifacts/ 2>/dev/null || true
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/nsis/*.exe.sig artifacts/ 2>/dev/null || true
          else
            cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/deb/*.deb.sig artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/rpm/*.rpm.sig artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage.sig artifacts/ 2>/dev/null || true
          fi
          # Tauri updater manifest
          cp src-tauri/target/*/release/bundle/macos/*.app.tar.gz artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: artifacts/*
          retention-days: 1

  # Headless server binary
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev libdbus-1-dev libglib2.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install
      - run: pnpm build:vite

      - name: Update version and build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          cd src-tauri && cargo build --release --bin streamforge-server --no-default-features

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/release/streamforge-server .
          tar czf "streamforge-server-${VERSION}-linux-x64.tar.gz" streamforge-server

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-x64
          path: |
            streamforge-server-*.tar.gz
            streamforge-server
          retention-days: 1

  # Docker image
  docker:
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-linux-x64
      - run: chmod +x streamforge-server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  # Create release and upload ALL artifacts — no race condition
  publish:
    needs: [desktop, server, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: all-artifacts

      - name: Download server artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: all-artifacts

      - name: Generate updater latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Find signature files for updater
          DARWIN_ARM64_SIG=$(cat all-artifacts/desktop-macOS-arm64/*.app.tar.gz.sig 2>/dev/null || echo "")
          DARWIN_X64_SIG=$(cat all-artifacts/desktop-macOS-x64/*.app.tar.gz.sig 2>/dev/null || echo "")
          LINUX_SIG=$(cat all-artifacts/desktop-Linux-x64/*.AppImage.sig 2>/dev/null || echo "")
          WINDOWS_SIG=$(cat all-artifacts/desktop-Windows-x64/*.exe.sig 2>/dev/null || echo "")

          DARWIN_ARM64_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/StreamForge_aarch64.app.tar.gz"
          DARWIN_X64_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/StreamForge_x64.app.tar.gz"
          LINUX_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/StreamForge_${VERSION}_amd64.AppImage"
          WINDOWS_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/StreamForge_${VERSION}_x64-setup.exe"

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "See the assets below to download and install StreamForge.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "platforms": {
              "darwin-aarch64": { "signature": "${DARWIN_ARM64_SIG}", "url": "${DARWIN_ARM64_URL}" },
              "darwin-x86_64": { "signature": "${DARWIN_X64_SIG}", "url": "${DARWIN_X64_URL}" },
              "linux-x86_64": { "signature": "${LINUX_SIG}", "url": "${LINUX_URL}" },
              "windows-x86_64": { "signature": "${WINDOWS_SIG}", "url": "${WINDOWS_URL}" }
            }
          }
          ENDJSON

      - name: Create release and upload all assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IS_PRERELEASE=${{ contains(github.ref_name, '-') }}

          PRERELEASE_FLAG=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Generate changelog from commits since last tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "${{ github.ref_name }}" | head -1)
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG".."${{ github.ref_name }}" -- | grep -v "^- Merge" || echo "- Bug fixes and improvements")
          else
            CHANGELOG="- Initial release"
          fi

          NOTES=$(cat <<ENDNOTES
          ## What's Changed

          ${CHANGELOG}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}
          ENDNOTES
          )

          # Create the release (always published, never draft)
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "StreamForge ${{ github.ref_name }}" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG \
            || true  # may already exist from a retry

          # Upload latest.json
          gh release upload "${{ github.ref_name }}" latest.json --repo "${{ github.repository }}" --clobber

          # Upload all desktop artifacts
          for dir in all-artifacts/desktop-*; do
            for file in "$dir"/*; do
              [ -f "$file" ] && gh release upload "${{ github.ref_name }}" "$file" --repo "${{ github.repository }}" --clobber
            done
          done

          # Upload server tarball
          for file in all-artifacts/server-linux-x64/streamforge-server-*.tar.gz; do
            [ -f "$file" ] && gh release upload "${{ github.ref_name }}" "$file" --repo "${{ github.repository }}" --clobber
          done

          echo "Release published: ${{ github.ref_name }}"
