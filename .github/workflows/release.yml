name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build Tauri desktop app (macOS, Windows, Linux) — all in parallel
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS-x64
          - platform: windows-latest
            args: --bundles nsis
            name: Windows-x64
          - platform: ubuntu-22.04
            args: ''
            name: Linux-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libdbus-1-dev libsqlite3-dev pkg-config libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i'' -e "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i'' -e "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
            sed -i'' -e "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
            sed -i "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'StreamForge ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install StreamForge.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # Build headless server binary — runs in parallel with desktop
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev libdbus-1-dev libglib2.0-dev

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build:vite

      - name: Update Cargo.toml version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Build streamforge-server
        working-directory: src-tauri
        run: cargo build --release --bin streamforge-server --no-default-features

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp src-tauri/target/release/streamforge-server .
          tar czf "streamforge-server-${VERSION}-linux-x64.tar.gz" streamforge-server

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-tarball
          path: streamforge-server-*.tar.gz
          retention-days: 1

      - name: Upload binary artifact (for Docker)
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: streamforge-server
          retention-days: 1

  # Build and push Docker image
  docker:
    needs: server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: server-binary

      - name: Make binary executable
        run: chmod +x streamforge-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  # Finalize release after all builds complete
  publish:
    needs: [desktop, server, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download server tarball
        uses: actions/download-artifact@v4
        with:
          name: server-tarball

      - name: Upload server binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" streamforge-server-*.tar.gz \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish release (if not beta)
        if: ${{ !contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
